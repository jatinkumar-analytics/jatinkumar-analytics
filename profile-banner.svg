  <circle cx="1110" cy="60" r="190" fill="#2563eb" opacity="0.10"/>
  <circle cx="1225" cy="355" r="215" fill="#14b8a6" opacity="0.09"/>
  <path d="M0 427H1280" stroke="url(#accent)" stroke-width="6"/>

